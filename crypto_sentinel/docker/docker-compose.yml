version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8082:80"
    volumes:
      - ../www:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crypto_db
    ports:
      - "33062:3306"
    volumes:
      - ../db_init:/docker-entrypoint-initdb.d
