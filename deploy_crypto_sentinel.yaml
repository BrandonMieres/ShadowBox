---
- name: Desplegar entorn de pentesting per a Crypto Sentinel
  hosts: localhost
  connection: local
  become: yes

  vars:
    exposed_port: 8082
    project_dir: "/home/ubuntu/crypto_sentinel"
    flag_prefix: "SH4D0WB0X_"
    maquina_nombre: "Crypto Sentinel"
    admin_user: "admin"
    admin_password: "SuperSecret123"
    secret_flag: "{{ flag_prefix }}{{ 1000 | random | to_uuid }}"

  pre_tasks:
    - name: Verificar si Ansible té la col·lecció community.postgresql
      command: ansible-galaxy collection list community.postgresql
      register: check_pg_collection
      ignore_errors: yes
      changed_when: false

    - name: Instal·lar community.postgresql si cal
      command: ansible-galaxy collection install community.postgresql
      when: check_pg_collection.rc != 0

  tasks:
    - name: Generar hash MD5 de la contrasenya
      set_fact:
        hashed_password: "{{ admin_password | hash('md5') }}"

    - name: Generar flag dinàmica
      set_fact:
        secret_flag: "{{ flag_prefix }}{{ 1000 | random | to_uuid }}"

    - name: Crear flag al directori web
      copy:
        dest: "{{ project_dir }}/www/flag.txt"
        content: "{{ secret_flag }}"
        mode: '0644'

    - name: Substituir __ADMIN_USER__ dins de init.sql
      replace:
        path: "{{ project_dir }}/db_init/init.sql"
        regexp: '__ADMIN_USER__'
        replace: "{{ admin_user }}"

    - name: Substituir __ADMIN_PASSWORD__ dins de init.sql
      replace:
        path: "{{ project_dir }}/db_init/init.sql"
        regexp: '__ADMIN_PASSWORD__'
        replace: "{{ hashed_password }}"

    - name: Substituir __SECRET_FLAG__ dins de init.sql
      replace:
        path: "{{ project_dir }}/db_init/init.sql"
        regexp: '__SECRET_FLAG__'
        replace: "{{ secret_flag }}"

    - name: Detenir i eliminar contenidors anteriors
      command: docker compose down -v
      args:
        chdir: "{{ project_dir }}/docker"
      ignore_errors: yes
      changed_when: false

    - name: Construir i desplegar contenidors
      command: docker compose up -d --build
      args:
        chdir: "{{ project_dir }}/docker"

    - name: Esperar servei web
      wait_for:
        host: localhost
        port: "{{ exposed_port }}"
        timeout: 30

    - name: Guardar credencials
      copy:
        dest: "{{ project_dir }}/credentials.txt"
        content: |
          🌐 URL: http://localhost:{{ exposed_port }}
          👤 Usuari: {{ admin_user }}
          🔐 Contrasenya: {{ admin_password }}
          🏁 Flag: {{ secret_flag }}

          🔓 Vector: MD5 hash (crypto feble)
        mode: '0600'

    - name: Enviar flag a Neon
      community.postgresql.postgresql_query:
        db: shadows
        login_user: shadows_owner
        login_password: npg_NMFyn6QGR5re
        login_host: ep-dark-credit-a2jn9u2r-pooler.eu-central-1.aws.neon.tech
        port: 5432
        ssl_mode: require
        query: |
          UPDATE maquinas
          SET respuesta = '{{ secret_flag }}'
          WHERE nombre = '{{ maquina_nombre }}';

    - name: Mostrar resum
      debug:
        msg: |
          ✅ Crypto Sentinel desplegada correctament
          URL: http://localhost:{{ exposed_port }}
          FLAG: {{ secret_flag }}
